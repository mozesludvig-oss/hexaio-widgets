<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{ --green:#7FCB6E; --lime:#B6DD55; --cyan:#2BA7C4; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent;overflow:hidden}
  .wrap{ display:flex; align-items:center; justify-content:center; gap:16px; padding:0; }
  .line{ height:3px; flex:1; max-width:320px; border-radius:3px;
    background:linear-gradient(90deg, rgba(127,203,110,0) 0%, var(--green) 35%, var(--lime) 100%); }
  .line.right{ transform:scaleX(-1); }
  .hex{ position:relative; width:34px; height:38px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    animation:float 4.5s ease-in-out infinite; }
  .hex img{ width:100%; height:auto; display:block;
    filter:drop-shadow(0 1px 4px rgba(43,167,196,.35)); }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  .ring{ position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--cyan); opacity:0; animation:ripple 4.5s ease-out infinite; }
  @keyframes ripple{ 0%{transform:scale(.6);opacity:.45} 70%{transform:scale(1.4);opacity:0} 100%{opacity:0} }
  @media (prefers-reduced-motion: reduce){ .hex{animation:none} .ring{animation:none;opacity:0} }
</style>
